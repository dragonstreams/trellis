services:
  trellis:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: trellis-bunny:local
    restart: unless-stopped
    init: true
    ports:
      - "8477:8477"
    volumes:
      - trellis-config:/config
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  trellis-config:
